name: Update Hisn al-Muslim text

on:
  schedule:
    - cron: '23 6 1 * *' # monthly; the text rarely changes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/selfcheck.mjs
      - run: node scripts/fetch-hisn.mjs
      - name: Commit if the text changed
        run: |
          git add iqama/hisn-text.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Hisn al-Muslim text"
          git push
