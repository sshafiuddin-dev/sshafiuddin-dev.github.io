name: Update ISCJ iqama times

on:
  schedule:
    - cron: '17 8 * * *' # about 3 to 4 AM in New York, before Fajr
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0, pinned to a commit so the tag cannot be moved under this write-access job
      - run: node scripts/selfcheck.mjs
      - run: node scripts/fetch-iqama.mjs
      - name: Commit if the times changed
        run: |
          git diff --quiet iqama/iqama.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update ISCJ iqama times"
          git push
