<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iqama Times</title>
    <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <!-- shares the portfolio's tokens, type and buttons -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="wrap iqama">
        <a class="back-link" href="/">Back to portfolio</a>
        <h1>Iqama Times</h1>
        <p class="iqama-date" id="todays-date"><span id="currentDate"></span></p>
        <section id="todays-timings" aria-label="Today's iqama times">
            <table id="today-timings">
                <thead>
                    <tr>
                        <th scope="col">Fajr</th>
                        <th scope="col">Dhuhr</th>
                        <th scope="col">Asr</th>
                        <th scope="col">Maghrib</th>
                        <th scope="col">Isha</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5">No timings available for today.</td></tr>
                </tbody>
            </table>
        </section>
        <button class="btn btn-outline" id="toggleMonthlyView" type="button" aria-expanded="false" aria-controls="monthlyView">Show this month</button>
        <div class="table-scroll" id="monthlyView" hidden>
            <table id="timings">
                <thead>
                    <tr>
                        <th>Date</th><th>Fajr</th><th>Dhuhr</th><th>Asr</th>
                        <th>Maghrib</th><th>Isha</th>
                        <th>Jummah - 1</th><th>Jummah - 2</th>
                        <th>Jummah - 3</th><th>Jummah - 4</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>
    <script src="script.js"></script>
    <script>
        const toggle = document.getElementById('toggleMonthlyView'), monthly = document.getElementById('monthlyView');
        toggle.addEventListener('click', () => {
            monthly.hidden = !monthly.hidden;
            toggle.setAttribute('aria-expanded', !monthly.hidden);
            toggle.textContent = monthly.hidden ? 'Show this month' : 'Hide this month';
        });
    </script>
</body>
</html>
